<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="/Login/login.css">
    <link rel="icon" href="/Asset/Logo.svg?v=1.1" type="image/svg">
</head>

<body>
    <a href="/" class="back-button">← กลับหน้าหลัก</a>
    <div class="login-container">
        <h2>เข้าสู่ระบบ</h2>
        <form id="loginForm" data-user-type="customer">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน:</label>
                <input type="password" id="password" name="password" required>
                <div class="show-password">
                    <input type="checkbox" id="show-password" onclick="showpassword()">
                    <label for="show-password">แสดงรหัสผ่าน</label>
                </div>
            </div>
            <input type="submit" value="เข้าสู่ระบบ">
        </form>
        <div id="error-message" class="error-message"></div>
        <div class="register-link">
            <p>ยังไม่มีบัญชี? <a href="/register">ลงทะเบียน</a></p>
        </div>
    </div>
    <script src="/Login/login.js"></script>
</body>

</html>
