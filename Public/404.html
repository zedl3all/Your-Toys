<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', 'Poppins', sans-serif;
            background: white;
            color: #333;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(45deg, #ffd600, #ff9800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            animation: float 3s ease-in-out infinite, pulse 2s ease-in-out infinite;
            position: relative;
            display: inline-block;
        }
        
        /* Animation for floating effect */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        
        /* Animation for pulse effect */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* Shake animation for each digit */
        .digit {
            color: #ffb300;
            display: inline-block;
            animation: wiggle 2s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.2s);
        }
        
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        
        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        p {
            font-size: 22px;
            margin-bottom: 30px;
            color: #555;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
            box-sizing: border-box;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #ffc107;
            color: #333;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #ffb300;
            transform: translateY(-3px);
            box-shadow: 0 7px 10px rgba(0,0,0,0.15);
        }
        .btn.secondary {
            background-color: #fff8e1;
            color: #333;
        }
        .btn.secondary:hover {
            background-color: #fffde7;
        }
        
        /* Responsive styles */
        @media (max-width: 768px) {
            .container {
                padding: 30px;
            }
            .error-code {
                font-size: 100px;
            }
            .error-icon {
                font-size: 60px;
            }
            p {
                font-size: 18px;
                margin-bottom: 25px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            .error-code {
                font-size: 80px;
            }
            .error-icon {
                font-size: 50px;
                margin-bottom: 15px;
            }
            p {
                font-size: 16px;
                margin-bottom: 20px;
            }
            .buttons {
                flex-direction: column;
                width: 100%;
                padding: 0;
            }
            .btn {
                width: 100%;
                padding: 10px 15px;
                margin-bottom: 10px;
            }
            .btn:last-child {
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">😕</div>
        <h1 class="error-code">
            <span class="digit" style="--i:0">4</span>
            <span class="digit" style="--i:1">0</span>
            <span class="digit" style="--i:2">4</span>
        </h1>
        <p>อุ๊ปส์! ขออภัยด้วยนะ เราหาทุกที่แล้วแต่ไม่เจอหน้านั้นเลย</p>
        <div class="buttons">
            <a href="/" class="btn">กลับหน้าหลัก</a>
            <a href="javascript:history.back()" class="btn secondary">ย้อนกลับ</a>
        </div>
    </div>
</body>
</html>
